<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="img/icon.png"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/search.css"/>
  <title>Nimbus — Search</title>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<div id="app">
  <header class="page-header">
    <h1 class="page-title"><i class="fa-solid fa-magnifying-glass"></i> Search City</h1>
  </header>

  <div class="search-wrap">
    <div class="search-bar">
      <i class="fa-solid fa-location-dot"></i>
      <input class="search-input" id="search-input" type="text" placeholder="e.g. Tokyo, Dubai, Paris…" autocomplete="off"/>
      <button class="search-btn" id="search-btn"><i class="fa-solid fa-arrow-right"></i></button>
    </div>
    <div class="search-suggestions" id="suggestions"></div>
  </div>

  <!-- Skeleton (hidden by default, shown during search) -->
  <div id="search-skeleton" style="display:none;">
    <div class="glass-card" style="padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
        <div><div class="sk" style="width:120px;height:22px;border-radius:8px;margin-bottom:8px;"></div><div class="sk" style="width:80px;height:14px;border-radius:6px;"></div></div>
        <div class="sk" style="width:50px;height:30px;border-radius:50px;"></div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="sk" style="width:90px;height:90px;border-radius:50%;flex-shrink:0;"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:10px;align-items:flex-end;">
          <div class="sk" style="width:100px;height:46px;border-radius:10px;"></div>
          <div class="sk" style="width:80px;height:16px;border-radius:6px;"></div>
          <div class="sk" style="width:60px;height:13px;border-radius:6px;"></div>
        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;">
      <div class="sk" style="height:70px;border-radius:16px;"></div>
      <div class="sk" style="height:70px;border-radius:16px;"></div>
      <div class="sk" style="height:70px;border-radius:16px;"></div>
      <div class="sk" style="height:70px;border-radius:16px;"></div>
    </div>
    <div class="sk" style="height:100px;border-radius:20px;margin-bottom:12px;"></div>
    <div class="sk" style="height:140px;border-radius:20px;margin-bottom:12px;"></div>
  </div>

  <div class="state-msg" id="msg-idle">
    <i class="fa-solid fa-earth-asia state-icon"></i>
    <p>Search any city to explore its current weather</p>
  </div>
  <div class="state-msg hidden" id="msg-error">
    <i class="fa-solid fa-triangle-exclamation state-icon error-icon"></i>
    <p id="error-text">City not found. Please try another name.</p>
  </div>

  <div id="result-area" class="hidden">
    <div class="result-hero glass-card">
      <div class="result-city-row">
        <div>
          <div class="result-city" id="r-city">--</div>
          <div class="result-country" id="r-country">--</div>
        </div>
        <button class="unit-btn" id="unit-toggle">°C</button>
      </div>
      <div class="result-main-row">
        <div class="result-icon-wrap"><img class="result-icon float-anim" id="r-icon" src="img/sun.png" alt=""/></div>
        <div class="result-temp-block">
          <div class="result-temp" id="r-temp">--°</div>
          <div class="result-desc" id="r-desc">--</div>
          <div class="result-feels" id="r-feels">Feels like --°</div>
        </div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><i class="fa-solid fa-wind"></i><div class="sv" id="r-wind">--</div><div class="sl">Wind</div></div>
      <div class="stat-card"><i class="fa-solid fa-droplet"></i><div class="sv" id="r-humid">--</div><div class="sl">Humidity</div></div>
      <div class="stat-card"><i class="fa-solid fa-gauge-high"></i><div class="sv" id="r-pressure">--</div><div class="sl">Pressure</div></div>
      <div class="stat-card"><i class="fa-solid fa-eye"></i><div class="sv" id="r-vis">--</div><div class="sl">Visibility</div></div>
      <div class="stat-card"><i class="fa-solid fa-sun"></i><div class="sv" id="r-sunrise">--</div><div class="sl">Sunrise</div></div>
      <div class="stat-card"><i class="fa-regular fa-moon"></i><div class="sv" id="r-sunset">--</div><div class="sl">Sunset</div></div>
      <div class="stat-card"><i class="fa-solid fa-temperature-high"></i><div class="sv" id="r-minmax">--</div><div class="sl">Min/Max</div></div>
      <div class="stat-card"><i class="fa-solid fa-cloud"></i><div class="sv" id="r-cloud">--</div><div class="sl">Clouds</div></div>
    </div>

    <!-- Wind Compass (search) -->
    <div class="glass-card">
      <div class="card-title">WIND</div>
      <div class="wind-compass-row">
        <div class="compass">
          <div class="compass-needle" id="r-compass-needle"></div>
          <div class="compass-dirs">
            <span class="dir-n">N</span><span class="dir-s">S</span>
            <span class="dir-e">E</span><span class="dir-w">W</span>
          </div>
        </div>
        <div style="flex:1;">
          <div class="wind-speed-big" id="r-wind-speed">--</div>
          <div class="wind-unit-small">m/s current wind</div>
          <div class="wind-dir-text" id="r-wind-dir">Direction: --</div>
          <div class="wind-gust" id="r-wind-gust"></div>
        </div>
      </div>
    </div>

    <div class="glass-card">
      <div class="card-title">5-DAY FORECAST</div>
      <div class="forecast-scroll" id="r-forecast"></div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a href="search.html" class="nav-item active"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></a>
  <a href="world.html" class="nav-item"><i class="fa-solid fa-earth-americas"></i><span>World</span></a>
</nav>

<script src="js/search.js"></script>
</body>
</html>
